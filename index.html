<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.json">
<title>STAFF OS AI</title>
<style>
:root{--bg:#0b1020;--card:#141b33;--line:#243056;--tx:#e8ecff;--mu:#8e9ac4;--g:#2ee6a6;--o:#ffb454;--b:#4da3ff;--r:#ff5c7a;--p:#b38cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:76px}
header{position:sticky;top:0;background:#0b1020ee;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0;letter-spacing:.5px}h1 b{color:var(--g)}h2{font-size:17px;margin:18px 0 8px}
main{padding:12px 14px;max-width:900px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1530;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 2px;font-size:12px}nav button.on{color:var(--g);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:26px;display:block}.stat span{color:var(--mu);font-size:13px}
button.b,.b{background:var(--g);color:#052;border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;margin:3px 3px 3px 0}
.b.o{background:var(--o)}.b.p{background:var(--p)}.b.r{background:var(--r);color:#fff}.b.x{background:#26335f;color:var(--tx)}
input,select{width:100%;padding:12px;margin:4px 0;background:#0b1328;color:var(--tx);border:1px solid var(--line);border-radius:10px;font-size:16px}
.mu{color:var(--mu);font-size:13px}.tag{padding:2px 8px;border-radius:9px;font-size:12px;background:#26335f}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{aspect-ratio:1;border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
.cal .h{aspect-ratio:auto;background:none;color:var(--mu);font-size:12px}.cal .sel{outline:2px solid var(--g)}
.dot{display:flex;gap:2px;margin-top:3px}.dot i{width:6px;height:6px;border-radius:50%}
.lock{max-width:340px;margin:12vh auto;padding:16px}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const bk=()=>new Date().toLocaleString('sv-SE',{timeZone:'Asia/Baku'}),today=()=>bk().slice(0,10),hm=t=>t?t.slice(11,16):'—';
const mins=(a,b)=>Math.round((new Date(b.replace(' ','T'))-new Date(a.replace(' ','T')))/6e4);
const fmt=m=>(m>=60?Math.floor(m/60)+' saat ':'')+m%60+' dəq';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---- IndexedDB
const dbp=new Promise(r=>{const q=indexedDB.open('staffos',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result)});
const load=async()=>{const d=await dbp;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result)})};
const save=async()=>{const d=await dbp;d.transaction('kv','readwrite').objectStore('kv').put(S,'s')};
let S,me=null,tab='panel',selDay=today(),calM=today().slice(0,7);
const hash=async(p,s)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const can=r=>me&&(r==='w'?me.role!=='viewer':r==='a'?me.role==='admin':true);
function log(act,det){S.audit.push({id:uid(),t:bk(),u:me?me.name:'sistem',act,det})}
async function commit(){await save();render()}
// ---- login
async function init(){
 S=await load()||{users:[],emps:[],att:[],brk:[],lv:[],abs:[],audit:[],cfg:{brkMin:20,limit:4,start:'09:00',brks:[['Səhər çayı','10:00'],['Günorta yeməyi','13:00'],['Axşam çayı','17:00']]}};
 const sid=sessionStorage.sid;if(sid)me=S.users.find(u=>u.id===sid)||null;render();setInterval(()=>{if(me&&!document.activeElement.matches('input,select')){render();alarm()}},30000)}
function loginView(){const first=!S.users.length;
 A.innerHTML=`<div class="lock"><h1>STAFF <b>OS</b> AI</h1><p class="mu">${first?'İlk açılış: baş administrator hesabı yaradın.':'Daxil olun.'}</p>
 <input id="ln" placeholder="İstifadəçi adı" autocapitalize="none"><input id="lp" type="password" placeholder="Parol (min 6 simvol)">
 <button class="b" style="width:100%" onclick="doLogin()">${first?'Hesab yarat':'Daxil ol'}</button><p class="mu" id="le"></p></div>`}
async function doLogin(){const n=$('#ln').value.trim(),p=$('#lp').value;if(!n||p.length<6)return $('#le').textContent='Ad və ən azı 6 simvolluq parol lazımdır.';
 if(!S.users.length){const salt=uid();me={id:uid(),name:n,role:'admin',salt,h:await hash(p,salt)};S.users.push(me);log('Admin yaradıldı',n)}
 else{const u=S.users.find(x=>x.name===n);if(!u||u.h!==await hash(p,u.salt))return $('#le').textContent='Ad və ya parol yanlışdır.';me=u;log('Giriş','')}
 sessionStorage.sid=me.id;tab='panel';await commit()}
// ---- helpers
const E=id=>S.emps.find(e=>e.id===id)||{name:'(silinib)'};
const act=()=>S.emps.filter(e=>e.on!==false);
const att=(e,d=today())=>S.att.find(a=>a.e===e&&a.d===d);
const openB=e=>S.brk.find(b=>b.e===e&&!b.end),openL=e=>S.lv.find(l=>l.e===e&&!l.end);
const absM=(e,m)=>S.abs.filter(a=>a.e===e&&a.d.slice(0,7)===m);
async function doAct(t,e,n){if(!can('w'))return alert('Səlahiyyət yoxdur.');const now=bk(),d=today(),emp=E(e).name;
 if(t==='in'&&!att(e)){S.att.push({id:uid(),e,d,in:now,by:me.name});log('Giriş',emp+' '+hm(now))}
 if(t==='out'){const a=att(e);if(a&&!a.out){if(openL(e)||openB(e))return alert('Əvvəl açıq icazə/fasilə bağlanmalıdır.');a.out=now;log('Çıxış',emp+' '+hm(now))}}
 if(t==='bs'&&att(e)&&!openB(e)&&!openL(e)){S.brk.push({id:uid(),e,d,n,s:now,end:null});log('Fasilə başladı',emp+' '+S.cfg.brks[n][0])}
 if(t==='be'){const b=openB(e);if(b){b.end=now;log('Fasilə bitdi',emp+' '+fmt(mins(b.s,now)))}}
 if(t==='ls'&&!openL(e)&&!openB(e)){const r=prompt('İcazə səbəbi / yer (məs. ASAN Xidmət):');if(!r)return;S.lv.push({id:uid(),e,d,s:now,end:null,r,by:me.name});log('İcazə çıxış',emp+' '+r+' '+hm(now))}
 if(t==='le'){const l=openL(e);if(l){l.end=now;log('İcazə qayıdış',emp+' '+fmt(mins(l.s,now)))}}
 await commit()}
let beeped={};function alarm(){S.brk.filter(b=>!b.end).forEach(b=>{if(mins(b.s,bk())>S.cfg.brkMin&&!beeped[b.id]){beeped[b.id]=1;try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.start();setTimeout(()=>o.stop(),600)}catch(_){}}})}
// ---- views
const NAV=[['panel','Panel'],['gun','Gün'],['isci','İşçilər'],['gelm','Gəlməmə'],['tq','Təqvim'],['sis','Sistem']];
function render(){if(!me)return loginView();let h=`<header><h1>STAFF <b>OS</b> AI</h1><span class="mu">${navigator.onLine?'🟢 online':'🟠 offline'} · ${esc(me.name)} <button class="b x" onclick="logout()">Çıx</button></span></header><main>`;
 h+=({panel,gun,isci,gelm,tq,sis}[tab])();h+=`</main><nav>${NAV.map(n=>`<button class="${tab===n[0]?'on':''}" onclick="tab='${n[0]}';render()">${n[1]}</button>`).join('')}</nav>`;A.innerHTML=h}
function logout(){delete sessionStorage.sid;me=null;render()}
function panel(){const L=act(),d=today(),inn=L.filter(e=>att(e.id)&&!att(e.id).out),lv=L.filter(e=>openL(e.id)),br=L.filter(e=>openB(e.id)),ab=L.filter(e=>S.abs.some(a=>a.e===e.id&&a.d===d)),
 no=L.filter(e=>!att(e.id)&&!ab.includes(e)),late=L.filter(e=>att(e.id)&&hm(att(e.id).in)>S.cfg.start),over=S.abs.length&&L.filter(e=>absM(e.id,d.slice(0,7)).length>S.cfg.limit);
 const st=(n,l,c)=>`<div class="stat"><b style="color:var(--${c})">${n}</b><span>${l}</span></div>`;
 return `<h2>Bu gün · ${d}</h2><div class="grid">${st(L.length,'Aktiv işçi','tx')}${st(inn.length,'İşdədir','g')}${st(lv.length,'İcazədə','p')}${st(br.length,'Fasilədə','o')}${st(no.length,'Gəlməyib','r')}${st(ab.length,'İcazəli gəlməmə','b')}${st(late.length,'Gecikən','r')}${st(over.length||0,'Limiti aşan','r')}</div>
 ${lv.length?'<h2>Açıq icazələr</h2>'+lv.map(e=>{const l=openL(e.id);return `<div class="card">${esc(e.name)} — ${esc(l.r)}<br><span class="mu">${hm(l.s)}-dən · ${fmt(mins(l.s,bk()))}</span></div>`}).join(''):''}
 ${br.length?'<h2>Fasilədə</h2>'+br.map(e=>{const b=openB(e.id),m=mins(b.s,bk());return `<div class="card">${esc(e.name)} — ${S.cfg.brks[b.n][0]}<br><span class="${m>S.cfg.brkMin?'tag':'mu'}" style="${m>S.cfg.brkMin?'color:var(--r)':''}">${fmt(m)}${m>S.cfg.brkMin?' · vaxt aşılıb!':''}</span></div>`}).join(''):''}
 <h2>Son əməliyyatlar</h2>${S.audit.slice(-6).reverse().map(a=>`<div class="mu">${hm(a.t)} ${esc(a.u)}: ${esc(a.act)} ${esc(a.det)}</div>`).join('')||'<p class="mu">Hələ əməliyyat yoxdur.</p>'}`}
function gun(){const L=act();if(!L.length)return '<p class="mu">Əvvəl "İşçilər" bölməsində işçi əlavə edin.</p>';
 return '<h2>Gündəlik idarəetmə</h2>'+L.map(e=>{const a=att(e.id),b=openB(e.id),l=openL(e.id),w=can('w');
 return `<div class="card"><b>${esc(e.name)}</b> <span class="mu">${esc(e.pos||'')}</span><br><span class="mu">Giriş ${hm(a?.in)} · Çıxış ${hm(a?.out)}</span><div>
 ${!a?`<button class="b" onclick="doAct('in','${e.id}')">Giriş</button>`:a.out?'':`<button class="b r" onclick="doAct('out','${e.id}')">Çıxış</button>`}
 ${a&&!a.out&&!b&&!l?S.cfg.brks.map((k,i)=>`<button class="b o" onclick="doAct('bs','${e.id}',${i})">${k[0]}</button>`).join('')+`<button class="b p" onclick="doAct('ls','${e.id}')">İcazəyə çıx</button>`:''}
 ${b?`<button class="b o" onclick="doAct('be','${e.id}')">Fasilədən qayıt</button>`:''}${l?`<button class="b p" onclick="doAct('le','${e.id}')">İcazədən qayıt</button>`:''}</div></div>`}).join('')}
function isci(){return `<h2>İşçilər</h2>${can('w')?`<div class="card"><input id="en" placeholder="Ad, soyad"><input id="ep" placeholder="Vəzifə"><input id="et" placeholder="Telefon"><button class="b" onclick="addEmp()">İşçi əlavə et</button></div>`:''}
 ${S.emps.map(e=>`<div class="card"><b>${esc(e.name)}</b> ${e.on===false?'<span class="tag">deaktiv</span>':''}<br><span class="mu">${esc(e.pos)} · ${esc(e.tel)}</span>${can('w')?`<br><button class="b x" onclick="togEmp('${e.id}')">${e.on===false?'Aktiv et':'Deaktiv et'}</button>`:''}</div>`).join('')}`}
async function addEmp(){const n=$('#en').value.trim();if(!n)return;S.emps.push({id:uid(),name:n,pos:$('#ep').value,tel:$('#et').value,on:true});log('İşçi əlavə',n);await commit()}
async function togEmp(id){const e=E(id);e.on=e.on===false;log(e.on?'Aktiv edildi':'Deaktiv edildi',e.name);await commit()}
function gelm(){const m=today().slice(0,7);return `<h2>İcazəli gəlməmə · ${m}</h2><p class="mu">Aylıq limit: ${S.cfg.limit} gün. 5-ci gündən tutulma yalnız rəhbər təsdiqi ilə tətbiq olunur.</p>
 ${can('w')&&act().length?`<div class="card"><select id="ae">${act().map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><input id="ad" type="date" value="${today()}"><input id="ar" placeholder="Səbəb"><button class="b" onclick="addAbs()">Qeyd et</button></div>`:''}
 ${act().map(e=>{const n=absM(e.id,m).length;return `<div class="card">${esc(e.name)} — <b style="color:var(--${n>S.cfg.limit?'r':n===S.cfg.limit?'o':'g'})">${n}/${S.cfg.limit}</b>${n>S.cfg.limit?` <span class="tag" style="color:var(--r)">Limit aşılıb: +${n-S.cfg.limit} gün (təsdiq gözləyir)</span>`:''}</div>`}).join('')}`}
async function addAbs(){const e=$('#ae').value,d=$('#ad').value;if(!d||S.abs.some(a=>a.e===e&&a.d===d))return alert('Bu gün artıq qeyd olunub.');S.abs.push({id:uid(),e,d,r:$('#ar').value,by:me.name});log('İcazəli gəlməmə',E(e).name+' '+d);await commit()}
function tq(){const[y,m]=calM.split('-').map(Number),first=new Date(y,m-1,1).getDay()||7,n=new Date(y,m,0).getDate();let c='';
 ['B.e','Ç.a','Ç','C.a','C','Ş','B'].forEach(x=>c+=`<div class="h">${x}</div>`);for(let i=1;i<first;i++)c+='<div style="background:none"></div>';
 for(let d=1;d<=n;d++){const ds=`${calM}-${String(d).padStart(2,'0')}`,dots=[];
  if(S.att.some(a=>a.d===ds&&hm(a.in)<=S.cfg.start))dots.push('g');if(S.att.some(a=>a.d===ds&&hm(a.in)>S.cfg.start))dots.push('r');if(S.abs.some(a=>a.d===ds))dots.push('o');if(S.lv.some(l=>l.d===ds))dots.push('p');
  c+=`<div class="${ds===selDay?'sel':''}" onclick="selDay='${ds}';render()">${d}<span class="dot">${dots.map(x=>`<i style="background:var(--${x})"></i>`).join('')}</span></div>`}
 const D=selDay;return `<h2><button class="b x" onclick="mv(-1)">‹</button> ${calM} <button class="b x" onclick="mv(1)">›</button></h2><div class="cal">${c}</div>
 <p class="mu">Yaşıl: normal · Qırmızı: gecikmə · Narıncı: icazəli gəlməmə · Bənövşəyi: müvəqqəti icazə</p><h2>${D}</h2>
 ${S.att.filter(a=>a.d===D).map(a=>`<div class="card">${esc(E(a.e).name)}: giriş ${hm(a.in)}, çıxış ${hm(a.out)}${a.out?' ('+fmt(mins(a.in,a.out))+')':''}${hm(a.in)>S.cfg.start?' <span class="tag" style="color:var(--r)">gecikmə</span>':''}</div>`).join('')}
 ${S.brk.filter(b=>b.d===D).map(b=>{const m=b.end?mins(b.s,b.end):null;return `<div class="card">${esc(E(b.e).name)} · ${S.cfg.brks[b.n][0]}: ${hm(b.s)}–${hm(b.end)} ${m!=null?fmt(m):'(davam edir)'}${m>S.cfg.brkMin?' <span class="tag" style="color:var(--r)">+'+(m-S.cfg.brkMin)+' dəq aşma</span>':''}</div>`}).join('')}
 ${S.lv.filter(l=>l.d===D).map(l=>`<div class="card">${esc(E(l.e).name)} · icazə (${esc(l.r)}): ${hm(l.s)}–${hm(l.end)} ${l.end?fmt(mins(l.s,l.end)):'(açıq)'}</div>`).join('')}
 ${S.abs.filter(a=>a.d===D).map(a=>`<div class="card">${esc(E(a.e).name)} · icazəli gəlməmə ${esc(a.r)}</div>`).join('')}`}
function mv(k){let[y,m]=calM.split('-').map(Number);m+=k;if(m<1){m=12;y--}if(m>12){m=1;y++}calM=`${y}-${String(m).padStart(2,'0')}`;render()}
function sis(){return `<h2>Parametrlər</h2><div class="card">${can('a')?`<span class="mu">Fasilə müddəti (dəq)</span><input id="cb" type="number" value="${S.cfg.brkMin}"><span class="mu">Aylıq icazəli gəlməmə limiti</span><input id="cl" type="number" value="${S.cfg.limit}"><span class="mu">İş başlama saatı</span><input id="cs" type="time" value="${S.cfg.start}">
 ${S.cfg.brks.map((k,i)=>`<span class="mu">${k[0]} saatı</span><input class="bt" type="time" value="${k[1]}">`).join('')}<button class="b" onclick="saveCfg()">Saxla</button>`:'<span class="mu">Yalnız administrator dəyişə bilər.</span>'}</div>
 <h2>Backup</h2><div class="card"><button class="b" onclick="exp()">JSON ixrac</button>${can('a')?`<input type="file" id="imp" accept=".json" onchange="imp(this.files[0])">`:''}</div>
 <h2>Audit tarixçəsi</h2>${S.audit.slice(-40).reverse().map(a=>`<div class="mu">${a.t} · ${esc(a.u)} · ${esc(a.act)} ${esc(a.det)}</div>`).join('')}`}
async function saveCfg(){const o={...S.cfg};S.cfg.brkMin=+$('#cb').value||20;S.cfg.limit=+$('#cl').value||4;S.cfg.start=$('#cs').value;document.querySelectorAll('.bt').forEach((x,i)=>S.cfg.brks[i][1]=x.value);log('Parametrlər dəyişdi',JSON.stringify(o)+' → '+JSON.stringify(S.cfg));await commit()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='staffos-backup-'+today()+'.json';a.click();log('Backup ixrac','')}
async function imp(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!d.users||!d.emps||!d.att||!d.cfg)throw 0;if(!confirm('Cari məlumatlar bu faylla əvəz olunacaq. Davam edək?'))return;S=d;log('Backup bərpa',f.name);await commit()}catch(_){alert('Fayl düzgün STAFF OS backup deyil.')}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
addEventListener('online',()=>me&&render());addEventListener('offline',()=>me&&render());
init();
</script></body></html>
