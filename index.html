<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.json">
<title>STAFF OS AI</title>
<style>
:root{--bg:#0b1020;--card:#141b33;--line:#243056;--tx:#e8ecff;--mu:#8e9ac4;--g:#2ee6a6;--o:#ffb454;--b:#4da3ff;--r:#ff5c7a;--p:#b38cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:76px}
header{position:sticky;top:0;background:#0b1020ee;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0;letter-spacing:.5px}h1 b{color:var(--g)}h2{font-size:17px;margin:18px 0 8px}
main{padding:12px 14px;max-width:900px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1530;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 2px;font-size:12px}nav button.on{color:var(--g);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
button.b,.b{background:var(--g);color:#052;border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;margin:3px 3px 3px 0}
.b.o{background:var(--o)}.b.p{background:var(--p)}.b.r{background:var(--r);color:#fff}.b.x{background:#26335f;color:var(--tx)}.b.sm{padding:8px 11px;font-size:13px}
input,select{width:100%;padding:12px;margin:4px 0;background:#0b1328;color:var(--tx);border:1px solid var(--line);border-radius:10px;font-size:16px}
.mu{color:var(--mu);font-size:13px}.tag{padding:2px 8px;border-radius:9px;font-size:12px;background:#26335f}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;min-height:68px;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:14px;word-break:break-word}
.tile span{font-size:11px}.tile.sel{background:#1f2a52;box-shadow:0 0 0 2px var(--tx)}
.tm{font-size:22px;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{aspect-ratio:1;border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
.cal .h{aspect-ratio:auto;background:none;color:var(--mu);font-size:12px}.cal .sel{outline:2px solid var(--g)}
.dot{display:flex;gap:2px;margin-top:3px}.dot i{width:6px;height:6px;border-radius:50%}
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:460px;max-height:88vh;overflow:auto}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.slot{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;min-height:84px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.slot.empty{color:var(--mu);align-items:center;justify-content:center;border-style:dashed}.slot .tm{font-size:17px}.tile .mu{font-size:10px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:6px;text-align:center}td:first-child{text-align:left}
@media print{header,nav,.noprint{display:none!important}*{color:#000!important;background:#fff!important}}
.lock{max-width:340px;margin:12vh auto;padding:16px}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const bk=()=>new Date().toLocaleString('sv-SE',{timeZone:'Asia/Baku'}),today=()=>bk().slice(0,10),hm=t=>t?t.slice(11,16):'—';
const P=t=>new Date(t.replace(' ','T'));
const mins=(a,b)=>Math.round((P(b)-P(a))/6e4);
const fmt=m=>(m>=60?Math.floor(m/60)+' saat ':'')+m%60+' dəq';
const tm=h=>+h.slice(0,2)*60+ +h.slice(3,5);
const addM=(s,m)=>{const d=new Date(P(s).getTime()+m*6e4);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---- IndexedDB
const dbp=new Promise(r=>{const q=indexedDB.open('staffos',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result)});
const load=async()=>{const d=await dbp;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result)})};
const save=async()=>{const d=await dbp;d.transaction('kv','readwrite').objectStore('kv').put(S,'s')};
let S,me=null,tab='panel',selDay=today(),calM=today().slice(0,7),sel=null,f='all',q='',editId=null;
const hash=async(p,s)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const can=r=>me&&(r==='w'?me.role!=='viewer':r==='a'?me.role==='admin':true);
function log(act,det){S.audit.push({id:uid(),t:bk(),u:me?me.name:'sistem',act,det})}
async function commit(){await save();render();queueSync()}
// ---- login
async function init(){
 S=await load()||{users:[],emps:[],att:[],brk:[],lv:[],abs:[],audit:[],cfg:{brkMin:20,limit:4,start:'09:00',brks:[['Səhər çayı','10:00'],['Günorta yeməyi','13:00'],['Axşam çayı','17:00']]}};
 S.rest=S.rest||[];S.sync=S.sync||{url:'',token:'',ver:0,last:'',status:'',snap:{}};const sid=sessionStorage.sid;if(sid)me=S.users.find(u=>u.id===sid)||null;if(!me&&S.sync.noLogin&&S.users.length)me=S.users.find(u=>u.role==='admin')||S.users[0];render();setInterval(tick,1000);queueSync()}
function loginView(){const first=!S.users.length;
 A.innerHTML=`<div class="lock"><h1>STAFF <b>OS</b> AI</h1><p class="mu">${first?'İlk açılış: baş administrator hesabı yaradın.':'Daxil olun.'}</p>
 <input id="ln" placeholder="İstifadəçi adı" autocapitalize="none"><input id="lp" type="password" placeholder="Parol (min 6 simvol)">
 <button class="b" style="width:100%" onclick="doLogin()">${first?'Hesab yarat':'Daxil ol'}</button><p class="mu" id="le"></p></div>`}
async function doLogin(){const n=$('#ln').value.trim(),p=$('#lp').value;if(!n||p.length<6)return $('#le').textContent='Ad və ən azı 6 simvolluq parol lazımdır.';
 if(!S.users.length){const salt=uid();me={id:uid(),name:n,role:'admin',salt,h:await hash(p,salt)};S.users.push(me);log('Admin yaradıldı',n)}
 else{const u=S.users.find(x=>x.name===n);if(!u||u.h!==await hash(p,u.salt))return $('#le').textContent='Ad və ya parol yanlışdır.';me=u;log('Giriş','')}
 sessionStorage.sid=me.id;tab='panel';await commit()}
// ---- helpers
const bm=id=>(S.emps.find(e=>e.id===id)||{}).bm||S.cfg.brkMin;
const E=id=>S.emps.find(e=>e.id===id)||{name:'(silinib)'};
const act=()=>S.emps.filter(e=>e.on!==false);
const att=(e,d=today())=>S.att.find(a=>a.e===e&&a.d===d);
const openB=e=>S.brk.find(b=>b.e===e&&!b.end),openL=e=>S.lv.find(l=>l.e===e&&!l.end);
const absM=(e,m)=>S.abs.filter(a=>a.e===e&&a.d.slice(0,7)===m);
function st(e){const d=today(),a=att(e.id);if(S.rest.some(x=>x.e===e.id&&x.d===d))return['rest','İstirahətdə','b'];
 if(S.abs.some(x=>x.e===e.id&&x.d===d))return['abs','İcazəli gəlməyib','o'];
 if(openL(e.id))return['lv','İcazədə','p'];if(openB(e.id))return['br','Fasilədə','o'];
 if(a&&a.out)return['out','İşdən çıxıb','mu'];return['in','İşdədir','g']}
async function doAct(t,e,n){if(!can('w'))return alert('Səlahiyyət yoxdur.');const d=today(),tv=$('#mt')&&$('#mt').value,now=tv?d+' '+tv+':00':bk(),emp=E(e).name;
 const ens=()=>{if(!att(e))S.att.push({id:uid(),e,d,in:d+' '+S.cfg.start+':00',auto:true,by:'avto'})};
 if(t==='rest'||t==='abs'){if(openL(e)||openB(e))return alert('Əvvəl açıq icazə/fasilə bağlanmalıdır.');
  const L=t==='rest'?S.rest:S.abs;if(L.some(x=>x.e===e&&x.d===d))return;const r=prompt('Səbəb (istəyə bağlı):');if(r===null)return;
  L.push({id:uid(),e,d,r,by:me.name});log(t==='rest'?'İstirahət günü':'İcazəli gəlməmə',emp+' '+d+' '+r);
  if(t==='abs'){const c=absM(e,d.slice(0,7)).length;if(c>S.cfg.limit)alert(emp+': aylıq limit aşıldı ('+c+'/'+S.cfg.limit+')')}}
 if(t==='reopen'){const a=att(e);if(a&&a.out){a.out=null;log('Çıxış ləğv edildi',emp)}}
 if(t==='undo'){S.rest=S.rest.filter(x=>!(x.e===e&&x.d===d));S.abs=S.abs.filter(x=>!(x.e===e&&x.d===d));log('Ləğv',emp+' '+d)}
 if(t==='out'){ens();const a=att(e);if(!a.out){if(openL(e)||openB(e))return alert('Əvvəl açıq icazə/fasilə bağlanmalıdır.');if(mins(a.in,now)<0)return alert('Çıxış saatı girişdən əvvəl ola bilməz.');a.out=now;log('Çıxış',emp+' '+hm(now))}}
 if(t==='bs'&&!openB(e)&&!openL(e)&&!S.brk.some(b=>b.e===e&&b.d===d&&b.n===n)){const busy=S.brk.filter(b=>!b.end).length,K=S.cfg.kitchen||6;if(busy>=K&&!confirm('Mətbəxdə '+busy+'/'+K+' nəfər var, yer yoxdur. Yenə də başlasın?'))return;ens();S.brk.push({id:uid(),e,d,n,s:now,end:null});log('Fasilə başladı',emp+' '+S.cfg.brks[n][0])}
 if(t==='be'){const b=openB(e);if(b){if(mins(b.s,now)<0)return alert('Bitmə saatı başlamadan əvvəl ola bilməz.');b.end=now;log('Fasilə bitdi',emp+' '+fmt(mins(b.s,now)))}}
 if(t==='ls'&&!openL(e)&&!openB(e)){const r=prompt('İcazə səbəbi / yer (məs. ASAN Xidmət):');if(!r)return;const m=parseInt(prompt('Neçə dəqiqəlik? (boş burax = qayıdanda yazılsın)\nMəs: 60 = 1 saat'))||0;
  ens();S.lv.push({id:uid(),e,d,s:now,end:null,r,lim:m,by:me.name});log('İcazə çıxış',emp+' '+r+' '+hm(now)+(m?' ('+fmt(m)+')':''))}
 if(t==='le'){const l=openL(e);if(l){if(mins(l.s,now)<0)return alert('Qayıdış saatı çıxışdan əvvəl ola bilməz.');l.end=now;log('İcazə qayıdış',emp+' '+fmt(mins(l.s,now)))}}
 sel=null;await commit()}
const fs=s=>{s=Math.abs(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,p=x=>String(x).padStart(2,'0');return(h?h+':':'')+p(m)+':'+p(c)};
let beeped={};
function tick(){if(!me)return;const n=P(bk());document.querySelectorAll('.tm').forEach(el=>{const el_=Math.floor((n-P(el.dataset.s))/1000),lim=+el.dataset.lim*60;
 if(!lim){el.textContent='⏱ '+fs(el_);return}const rem=lim-el_;
 if(rem>=0){el.textContent='⏳ qalıb '+fs(rem);el.style.color='var(--g)'}
 else{el.textContent='⚠ aşıb +'+fs(rem);el.style.color='var(--r)';if(!beeped[el.dataset.s]){beeped[el.dataset.s]=1;try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.start();setTimeout(()=>o.stop(),700)}catch(_){}}}})}
// ---- views
const NAV=[['panel','Panel'],['isci','İşçilər'],['gelm','Gəlməmə'],['tq','Təqvim'],['hes','Hesabat'],['sis','Sistem']];
function render(){if(!me)return loginView();let h=`<header><h1>STAFF <b>OS</b> AI</h1><span class="mu">${navigator.onLine?'🟢 online':'🟠 offline'} · ${esc(me.name)} ${S.sync.noLogin?'':'<button class="b x sm" onclick="logout()">Çıx</button>'}</span></header><main>`;
 h+=({panel,isci,gelm,tq,hes:hesab,sis}[tab])();h+=`</main><nav>${NAV.map(n=>`<button class="${tab===n[0]?'on':''}" onclick="tab='${n[0]}';render()">${n[1]}</button>`).join('')}</nav>`;A.innerHTML=h;
 const i=$('#q');if(i&&window.fq){i.focus();i.setSelectionRange(99,99);window.fq=0}tick()}
function logout(){delete sessionStorage.sid;me=null;render()}
function pick(id){sel=sel===id?null:id;render()}
function panel(){const L=act(),d=today();if(!L.length)return '<h2>Panel</h2><p class="mu">Hələ işçi yoxdur. "İşçilər" bölməsindən əlavə edin.</p>';
 const sts=L.map(e=>[e,st(e)]),cnt=k=>sts.filter(x=>k==='all'||x[1][0]===k).length,ql=q.toLowerCase();
 const chips=[['all','Hamısı'],['in','İşdə'],['br','Fasilədə'],['lv','İcazədə'],['rest','İstirahət'],['abs','İcazəli gəlməmə']].map(c=>`<button class="b sm ${f===c[0]?'':'x'}" onclick="f='${c[0]}';render()">${c[1]} ${cnt(c[0])}</button>`).join('');
 const vis=sts.filter(x=>(f==='all'||x[1][0]===f)&&x[0].name.toLowerCase().includes(ql));
 const tl=e=>{const b=openB(e.id),l=openL(e.id),a=att(e.id);if(b)return S.cfg.brks[b.n][0]+' '+hm(b.s)+'→'+addM(b.s,bm(b.e));if(l)return 'İcazə '+hm(l.s)+'→'+(l.lim?addM(l.s,l.lim):'?');if(a&&a.out)return 'Çıxıb '+hm(a.out);
  const lb=S.brk.filter(x=>x.e===e.id&&x.d===d&&x.end).pop();return lb?'Son: '+S.cfg.brks[lb.n][0]+' '+hm(lb.s)+'–'+hm(lb.end):''};
 const tiles=vis.map(([e,s])=>`<div class="tile" style="border-color:var(--${s[2]})" onclick="pick('${e.id}')"><b>${esc(e.name)}</b><span style="color:var(--${s[2]})">${s[1]}</span><span class="mu">${esc(tl(e))}</span></div>`).join('')||'<p class="mu">Uyğun işçi tapılmadı.</p>';
 const e=L.find(x=>x.id===sel);let modal='';
 if(e){const s=st(e),k=s[0];
  const recs=[...S.att.filter(x=>x.e===e.id&&x.d===d).map(x=>['att',x.id,'İş günü '+hm(x.in)+(x.auto?' (avto)':'')+' – '+hm(x.out)]),...S.brk.filter(x=>x.e===e.id&&x.d===d).map(x=>['brk',x.id,S.cfg.brks[x.n][0]+' '+hm(x.s)+' – '+hm(x.end)]),...S.lv.filter(x=>x.e===e.id&&x.d===d).map(x=>['lv',x.id,'İcazə ('+x.r+') '+hm(x.s)+' – '+hm(x.end)])];
  modal=`<div class="ov" onclick="sel=null;render()"><div class="mod" style="border-color:var(--${s[2]})" onclick="event.stopPropagation()"><b style="font-size:19px">${esc(e.name)}</b> <span class="tag">${s[1]}</span><br>
  <span class="mu">Saat (boş burax = indiki vaxt, istəsən özün seç)</span><input id="mt" type="time"><div>
  ${k==='in'?S.cfg.brks.map((x,i)=>{const u=S.brk.some(y=>y.e===e.id&&y.d===d&&y.n===i);return `<button class="b ${u?'x':'o'}" ${u?'disabled':''} onclick="doAct('bs','${e.id}',${i})">${u?'✓ ':''}${x[0]} (${x[1]})</button>`}).join('')+`<button class="b p" onclick="doAct('ls','${e.id}')">Saatlıq icazə</button><button class="b" style="background:var(--b)" onclick="doAct('rest','${e.id}')">İstirahət günü</button><button class="b x" onclick="doAct('abs','${e.id}')">İcazəli gəlməmə</button><button class="b r" onclick="if(confirm('Gün bitdi, çıxış qeyd olunsun?'))doAct('out','${e.id}')">Gün bitdi / Çıxış</button>`:''}
  ${k==='out'?`<button class="b" onclick="doAct('reopen','${e.id}')">Yenidən işdə et (çıxışı ləğv et)</button>`:''}
  ${k==='br'?`<button class="b o" onclick="doAct('be','${e.id}')">Fasilədən qayıt</button>`:''}${k==='lv'?`<button class="b p" onclick="doAct('le','${e.id}')">İcazədən qayıt</button>`:''}
  ${k==='rest'||k==='abs'?`<button class="b x" onclick="doAct('undo','${e.id}')">Ləğv et (işdədir)</button>`:''}</div>
  ${recs.length?'<h2 style="font-size:15px">Bu günün qeydləri</h2>'+recs.map(r=>`<div class="mu" style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin:4px 0">${esc(r[2])}<button class="b x sm" onclick="editRec('${r[0]}','${r[1]}')">✎ Saatı düzəlt</button></div>`).join(''):''}
  <div style="margin-top:10px"><button class="b x sm" onclick="editEmp('${e.id}')">✎ Adı redaktə et</button><button class="b x" onclick="sel=null;render()">Bağla</button></div></div></div>`}
 const ob=S.brk.filter(b=>!b.end).sort((x,y)=>x.s<y.s?-1:1),K=S.cfg.kitchen||6;let ks='';
 for(let i=0;i<Math.max(K,ob.length);i++){const b=ob[i];ks+=b?`<div class="slot" style="border-color:var(--${i>=K?'r':'o'})"><b>${esc(E(b.e).name)}</b><span class="mu">${S.cfg.brks[b.n][0]} · ${hm(b.s)}→${addM(b.s,bm(b.e))}</span><b class="tm" data-s="${b.s}" data-lim="${bm(b.e)}"></b>${i>=K?'<span style="color:var(--r)">yerdən artıq</span>':''}</div>`:`<div class="slot empty">Boş yer ${i+1}</div>`}
 const live=L.filter(x=>openL(x.id)).map(x=>{const l=openL(x.id);return `<div class="card" style="border-color:var(--p)"><b>${esc(x.name)}</b> — icazədədir (${esc(l.r)})<br><span class="mu">${hm(l.s)}-də çıxıb · ${l.lim?addM(l.s,l.lim)+'-də qayıtmalıdır':'qayıdış vaxtı qayıdanda yazılacaq'}</span><br><b class="tm" data-s="${l.s}" data-lim="${l.lim||0}"></b></div>`}).join('');
 const nh=hm(bk()),due=sts.filter(x=>x[1][0]==='in').map(x=>x[0]).flatMap(x=>S.cfg.brks.map((k,i)=>[x,k,i]).filter(([x,k,i])=>tm(k[1])<=tm(nh)&&tm(nh)-tm(k[1])<=60&&!S.brk.some(b=>b.e===x.id&&b.d===d&&b.n===i)));
 return `<h2>İşçilər · ${d}</h2><p class="mu">Hamı gündəlik işdə sayılır. Adına toxun, menyudan seç.</p><input placeholder="🔍 Ad ilə axtar" id="q" value="${esc(q)}" oninput="q=this.value;fq=1;render()"><div style="margin:6px 0">${chips}</div>
 <div class="tiles">${tiles}</div>
 <h2>Mətbəx · ${ob.length}/${K}</h2><div class="slots">${ks}</div>
 ${live?'<h2>İcazədə olanlar</h2>'+live:''}
 ${due.length?'<h2>Fasilə vaxtı çatıb, hələ çıxmayıb</h2>'+due.map(([x,k])=>`<div class="mu">• ${esc(x.name)} — ${k[0]} (${k[1]})</div>`).join(''):''}
 <h2>Son əməliyyatlar</h2>${S.audit.slice(-5).reverse().map(a=>`<div class="mu">${hm(a.t)} ${esc(a.u)}: ${esc(a.act)} ${esc(a.det)}</div>`).join('')||'<p class="mu">Hələ əməliyyat yoxdur.</p>'}${modal}`}
function fld(p,e){e=e||{};return `<input id="${p}n" value="${esc(e.name)}" placeholder="Ad, soyad"><input id="${p}p" value="${esc(e.pos)}" placeholder="Vəzifə"><input id="${p}d" value="${esc(e.dep)}" placeholder="Şöbə"><input id="${p}t" value="${esc(e.tel)}" placeholder="Telefon"><span class="mu">Doğum tarixi</span><input id="${p}b" type="date" value="${esc(e.bd)}">${can('a')?`<input id="${p}s" type="number" value="${esc(e.sal)}" placeholder="Aylıq maaş (AZN)">`:''}<input id="${p}k" type="number" value="${esc(e.bm)}" placeholder="Fərdi fasilə müddəti, dəq (boş = ümumi ${S.cfg.brkMin})">`}
function isci(){return `<h2>İşçilər</h2>${can('w')?`<div class="card">${fld('e')}<button class="b" onclick="addEmp()">İşçi əlavə et</button></div>`:''}
 ${S.emps.map(e=>editId===e.id?`<div class="card" style="border-color:var(--g)">${fld('x',e)}<button class="b" onclick="saveEmp('${e.id}')">Yadda saxla</button><button class="b x" onclick="editId=null;render()">Ləğv et</button></div>`:`<div class="card"><b>${esc(e.name)}</b> ${e.on===false?'<span class="tag">deaktiv</span>':''}<br><span class="mu">${esc(e.pos)}${e.dep?' · '+esc(e.dep):''} · ${esc(e.tel)}${e.bm?' · fasilə '+e.bm+' dəq':''}${can('a')&&e.sal?' · maaş '+esc(e.sal):''}</span>${can('w')?`<br><button class="b x sm" onclick="editEmp('${e.id}')">✎ Redaktə</button><button class="b x sm" onclick="togEmp('${e.id}')">${e.on===false?'Aktiv et':'Deaktiv et'}</button>`:''}</div>`).join('')}`}
function editEmp(id){if(!can('w'))return alert('Səlahiyyət yoxdur.');editId=id;sel=null;tab='isci';render()}
async function editRec(k,id){if(!can('w'))return alert('Səlahiyyət yoxdur.');const r=(k==='att'?S.att:k==='brk'?S.brk:S.lv).find(x=>x.id===id);if(!r)return;
 const s=k==='att'?'in':'s',en=k==='att'?'out':'end',ok=/^\d{2}:\d{2}$/;
 const a=prompt('Başlama saatı (SS:DD):',hm(r[s]));if(a===null)return;const b=prompt('Bitmə saatı (SS:DD). Boş = hələ davam edir:',r[en]?hm(r[en]):'');if(b===null)return;
 if(!ok.test(a)||(b&&!ok.test(b)))return alert('Saat formatı SS:DD olmalıdır, məs. 13:05');
 const ns=r.d+' '+a+':00',ne=b?r.d+' '+b+':00':null;if(ne&&mins(ns,ne)<0)return alert('Bitmə saatı başlamadan əvvəl ola bilməz.');
 const why=prompt('Düzəliş səbəbi:');if(why===null)return;const o=hm(r[s])+'–'+hm(r[en]);r[s]=ns;r[en]=ne;if(k==='att')r.auto=false;
 log('Saat düzəlişi',E(r.e).name+' '+o+' → '+a+'–'+(b||'—')+' ('+why+')');await commit()}
async function saveEmp(id){const e=E(id),n=$('#xn').value.trim();if(!n)return alert('Ad boş ola bilməz.');const o=JSON.stringify([e.name,e.pos,e.dep,e.tel,e.bd,e.bm]);
 e.name=n;e.pos=$('#xp').value;e.dep=$('#xd').value;e.tel=$('#xt').value;e.bd=$('#xb').value;if($('#xs'))e.sal=$('#xs').value;e.bm=+$('#xk').value||0;
 log('İşçi redaktə',o+' → '+JSON.stringify([e.name,e.pos,e.dep,e.tel,e.bd,e.bm]));editId=null;await commit()}
async function addEmp(){const n=$('#en').value.trim();if(!n)return alert('Ad yazın.');S.emps.push({id:uid(),name:n,pos:$('#ep').value,dep:$('#ed').value,tel:$('#et').value,bd:$('#eb').value,sal:$('#es')?$('#es').value:'',bm:+$('#ek').value||0,on:true});log('İşçi əlavə',n);await commit()}
async function togEmp(id){const e=E(id);e.on=e.on===false;log(e.on?'Aktiv edildi':'Deaktiv edildi',e.name);await commit()}
function gelm(){const m=today().slice(0,7);return `<h2>İcazəli gəlməmə · ${m}</h2><p class="mu">Aylıq limit: ${S.cfg.limit} gün. 5-ci gündən tutulma yalnız rəhbər təsdiqi ilə tətbiq olunur.</p>
 ${can('w')&&act().length?`<div class="card"><select id="ae">${act().map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><input id="ad" type="date" value="${today()}"><input id="ar" placeholder="Səbəb"><button class="b" onclick="addAbs()">Qeyd et</button></div>`:''}
 ${act().map(e=>{const n=absM(e.id,m).length;return `<div class="card">${esc(e.name)} — <b style="color:var(--${n>S.cfg.limit?'r':n===S.cfg.limit?'o':'g'})">${n}/${S.cfg.limit}</b>${n>S.cfg.limit?` <span class="tag" style="color:var(--r)">Limit aşılıb: +${n-S.cfg.limit} gün (təsdiq gözləyir)</span>`:''}</div>`}).join('')}`}
async function addAbs(){const e=$('#ae').value,d=$('#ad').value;if(!d||S.abs.some(a=>a.e===e&&a.d===d))return alert('Bu gün artıq qeyd olunub.');S.abs.push({id:uid(),e,d,r:$('#ar').value,by:me.name});log('İcazəli gəlməmə',E(e).name+' '+d);await commit()}
function tq(){const[y,m]=calM.split('-').map(Number),first=new Date(y,m-1,1).getDay()||7,n=new Date(y,m,0).getDate();let c='';
 ['B.e','Ç.a','Ç','C.a','C','Ş','B'].forEach(x=>c+=`<div class="h">${x}</div>`);for(let i=1;i<first;i++)c+='<div style="background:none"></div>';
 for(let d=1;d<=n;d++){const ds=`${calM}-${String(d).padStart(2,'0')}`,dots=[];
  if(S.att.some(a=>a.d===ds&&hm(a.in)<=S.cfg.start))dots.push('g');if(S.att.some(a=>a.d===ds&&hm(a.in)>S.cfg.start))dots.push('r');if(S.abs.some(a=>a.d===ds))dots.push('o');if(S.rest.some(a=>a.d===ds))dots.push('b');if(S.lv.some(l=>l.d===ds))dots.push('p');
  c+=`<div class="${ds===selDay?'sel':''}" onclick="selDay='${ds}';render()">${d}<span class="dot">${dots.map(x=>`<i style="background:var(--${x})"></i>`).join('')}</span></div>`}
 const D=selDay;return `<h2><button class="b x" onclick="mv(-1)">‹</button> ${calM} <button class="b x" onclick="mv(1)">›</button></h2><div class="cal">${c}</div>
 <p class="mu">Yaşıl: normal · Qırmızı: gecikmə · Narıncı: icazəli gəlməmə · Bənövşəyi: müvəqqəti icazə</p><h2>${D}</h2>
 ${(()=>{const bt=(k,id,ed)=>can('w')?` ${ed?`<button class="b x sm" onclick="editRec('${k}','${id}')">✎ Düzəlt</button>`:''}<button class="b r sm" onclick="delRec('${k}','${id}')">🗑 Sil</button>`:'';
 const c=t=>`<div class="card">${t}</div>`;
 return [...S.att.filter(a=>a.d===D).map(a=>c(`${esc(E(a.e).name)}: giriş ${hm(a.in)}, çıxış ${hm(a.out)}${a.out?' ('+fmt(mins(a.in,a.out))+')':''}${!a.auto&&hm(a.in)>S.cfg.start?' <span class="tag" style="color:var(--r)">gecikmə</span>':''}${bt('att',a.id,1)}`)),
 ...S.brk.filter(b=>b.d===D).map(b=>{const m=b.end?mins(b.s,b.end):null;return c(`${esc(E(b.e).name)} · ${S.cfg.brks[b.n][0]}: ${hm(b.s)}–${hm(b.end)} ${m!=null?fmt(m):'(davam edir)'}${m>bm(b.e)?' <span class="tag" style="color:var(--r)">+'+(m-bm(b.e))+' dəq aşma</span>':''}${bt('brk',b.id,1)}`)}),
 ...S.lv.filter(l=>l.d===D).map(l=>c(`${esc(E(l.e).name)} · icazə (${esc(l.r)}): ${hm(l.s)}–${hm(l.end)} ${l.end?fmt(mins(l.s,l.end)):'(açıq)'}${bt('lv',l.id,1)}`)),
 ...S.rest.filter(a=>a.d===D).map(a=>c(`${esc(E(a.e).name)} · istirahət günü ${esc(a.r)}${bt('rest',a.id,0)}`)),
 ...S.abs.filter(a=>a.d===D).map(a=>c(`${esc(E(a.e).name)} · icazəli gəlməmə ${esc(a.r)}${bt('abs',a.id,0)}`))].join('')||'<p class="mu">Bu gün üçün qeyd yoxdur.</p>'})()}`}
async function toggleNoLogin(){if(!can('a'))return alert('Yalnız administrator.');
 if(!S.sync.noLogin){if(!confirm('Bu cihazda parol soruşulmayacaq. Telefonu tutan hər kəs proqramı aça bilər. Davam edək?'))return;S.sync.noLogin=true;log('Parolsuz giriş açıldı (bu cihaz)','')}
 else{S.sync.noLogin=false;log('Parollu giriş bərpa olundu (bu cihaz)','')}await commit()}
async function resetData(scope){if(!can('a'))return alert('Yalnız administrator.');const w=scope==='today'?'bu günün':'bütün';
 if(prompt('Diqqət: '+w+' qeydləri (davamiyyət, fasilə, icazə, istirahət) silinəcək. İşçilər və hesablar qalır.\nDavam etmək üçün SIFIRLA yazın:')!=='SIFIRLA')return;
 const d=today(),keep=x=>scope==='today'&&x.d!==d;let n=0;for(const K of['att','brk','lv','abs','rest']){const b=S[K].length;S[K]=S[K].filter(keep);n+=b-S[K].length}
 log('Qeydlər sıfırlandı',w+': '+n+' qeyd silindi');await commit()}
async function delRec(k,id){if(!can('w'))return alert('Səlahiyyət yoxdur.');const A=S[k],r=A.find(x=>x.id===id);if(!r)return;
 if(!confirm('Bu qeyd silinsin?'))return;const why=prompt('Silmə səbəbi:');if(why===null)return;S[k]=A.filter(x=>x.id!==id);
 log('Qeyd silindi',E(r.e).name+' · '+k+' · '+r.d+' ('+why+')');await commit()}
let rf=today().slice(0,8)+'01',rt=today(),re='all';
const RH=['İşçi','İş günü','İstirahət','İcazəli gəlməmə','Gecikmə','Fasilə sayı','Fasilə (dəq)','Artıq fasilə (dəq)','İcazə sayı','İcazə (dəq)'];
function calc(from,to,eid){const inR=d=>d>=from&&d<=to,days=Math.round((new Date(to)-new Date(from))/864e5)+1;
 return act().filter(e=>eid==='all'||e.id===eid).map(e=>{const rest=S.rest.filter(x=>x.e===e.id&&inR(x.d)).length,ab=S.abs.filter(x=>x.e===e.id&&inR(x.d)).length,
  lates=S.att.filter(x=>x.e===e.id&&inR(x.d)&&!x.auto&&hm(x.in)>S.cfg.start).length,bs=S.brk.filter(x=>x.e===e.id&&inR(x.d)&&x.end),
  bt=bs.reduce((s,x)=>s+mins(x.s,x.end),0),bo=bs.reduce((s,x)=>s+Math.max(0,mins(x.s,x.end)-bm(e.id)),0),ls=S.lv.filter(x=>x.e===e.id&&inR(x.d)&&x.end),lt=ls.reduce((s,x)=>s+mins(x.s,x.end),0);
  return [e.name,days-rest-ab,rest,ab,lates,bs.length,bt,bo,ls.length,lt]})}
function hesab(){const bad=rf>rt,R=bad?[]:calc(rf,rt,re);
 return `<h2>Hesabat</h2><div class="card noprint"><span class="mu">Başlanğıc tarix</span><input type="date" value="${rf}" onchange="rf=this.value;render()"><span class="mu">Son tarix</span><input type="date" value="${rt}" onchange="rt=this.value;render()">
 <select onchange="re=this.value;render()"><option value="all">Bütün işçilər</option>${act().map(e=>`<option value="${e.id}" ${re===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select><button class="b" onclick="csv()">Excel (CSV)</button><button class="b x" onclick="window.print()">Çap / PDF</button></div>
 ${bad?'<p class="mu" style="color:var(--r)">Başlanğıc tarix son tarixdən böyükdür.</p>':`<p class="mu">${rf} → ${rt}</p><div style="overflow-x:auto"><table><tr>${RH.map(x=>`<th>${x}</th>`).join('')}</tr>${R.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`}`}
function csv(){if(rf>rt)return;const rows=[RH,...calc(rf,rt,re)],t='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='hesabat-'+rf+'_'+rt+'.csv';a.click();log('Hesabat ixrac',rf+'→'+rt)}
function mv(k){let[y,m]=calM.split('-').map(Number);m+=k;if(m<1){m=12;y--}if(m>12){m=1;y++}calM=`${y}-${String(m).padStart(2,'0')}`;render()}
function sis(){return `<h2>Parametrlər</h2><div class="card">${can('a')?`<span class="mu">Fasilə müddəti (dəq)</span><input id="cb" type="number" value="${S.cfg.brkMin}"><span class="mu">Aylıq icazəli gəlməmə limiti</span><input id="cl" type="number" value="${S.cfg.limit}"><span class="mu">Mətbəx yer sayı</span><input id="ck" type="number" value="${S.cfg.kitchen||6}"><span class="mu">İş başlama saatı</span><input id="cs" type="time" value="${S.cfg.start}">
 ${S.cfg.brks.map((k,i)=>`<span class="mu">${k[0]} saatı</span><input class="bt" type="time" value="${k[1]}">`).join('')}<button class="b" onclick="saveCfg()">Saxla</button>`:'<span class="mu">Yalnız administrator dəyişə bilər.</span>'}</div>
 <h2>Giriş</h2><div class="card">${can('a')?`<span class="mu">${S.sync.noLogin?'Bu cihazda parol soruşulmur, proqram birbaşa açılır.':'Bu cihazda hər açılışda ad və parol soruşulur.'}</span><br><button class="b ${S.sync.noLogin?'':'o'}" onclick="toggleNoLogin()">${S.sync.noLogin?'Parolu yenidən aktiv et':'Bu cihazda parolsuz aç'}</button>`:'<span class="mu">Yalnız administrator.</span>'}</div>
 <h2>Sıfırlama</h2><div class="card">${can('a')?`<span class="mu">İşçilər, hesablar və parametrlər qalır. Audit tarixçəsi silinmir. Əvvəl JSON ixrac ilə backup götürmək məsləhətdir.</span><br><button class="b o" onclick="resetData('today')">Bu günün qeydlərini sil</button><button class="b r" onclick="resetData('all')">Bütün test qeydlərini sil</button>`:'<span class="mu">Yalnız administrator.</span>'}</div>
 <h2>Bulud sinxronizasiyası</h2><div class="card">${can('a')?`<input id="su" value="${esc(S.sync.url)}" placeholder="Server ünvanı (https://...workers.dev)"><input id="sk" type="password" value="${esc(S.sync.token)}" placeholder="Sinxron açarı"><button class="b" onclick="saveSync()">Yadda saxla</button><button class="b x" onclick="syncNow()">İndi sinxronla</button>`:'<span class="mu">Yalnız administrator dəyişə bilər.</span>'}<p class="mu">${esc(S.sync.status||'Qoşulmayıb')}</p></div>
 <h2>Backup</h2><div class="card"><button class="b" onclick="exp()">JSON ixrac</button>${can('a')?`<input type="file" id="imp" accept=".json" onchange="imp(this.files[0])">`:''}</div>
 <h2>Audit tarixçəsi</h2>${S.audit.slice(-40).reverse().map(a=>`<div class="mu">${a.t} · ${esc(a.u)} · ${esc(a.act)} ${esc(a.det)}</div>`).join('')}`}
async function saveCfg(){const o={...S.cfg};S.cfg.brkMin=+$('#cb').value||20;S.cfg.limit=+$('#cl').value||4;S.cfg.start=$('#cs').value;S.cfg.at=bk();S.cfg.kitchen=+$('#ck').value||6;document.querySelectorAll('.bt').forEach((x,i)=>S.cfg.brks[i][1]=x.value);log('Parametrlər dəyişdi',JSON.stringify(o)+' → '+JSON.stringify(S.cfg));await commit()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(strip())],{type:'application/json'}));a.download='staffos-backup-'+today()+'.json';a.click();log('Backup ixrac','')}
async function imp(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!d.users||!d.emps||!d.att||!d.cfg)throw 0;d.rest=d.rest||[];d.sync=S.sync;if(!confirm('Cari məlumatlar bu faylla əvəz olunacaq. Davam edək?'))return;S=d;log('Backup bərpa',f.name);await commit()}catch(_){alert('Fayl düzgün STAFF OS backup deyil.')}}
const KS=['emps','users','att','brk','lv','abs','rest','audit'];let sto;
const strip=()=>{const{sync,...r}=S;return r};
const snapOf=()=>{const m={};KS.forEach(K=>(S[K]||[]).forEach(x=>m[x.id]=JSON.stringify(x)));return m};
function queueSync(){const c=S&&S.sync;if(!c||!c.url||!c.token||!navigator.onLine)return;clearTimeout(sto);sto=setTimeout(()=>syncNow(true),4000)}
function setSt(t){S.sync.status=t;if(me&&tab==='sis'&&!document.activeElement.matches('input'))render()}
async function saveSync(){S.sync.url=$('#su').value.trim();S.sync.token=$('#sk').value.trim();log('Sinxron parametrləri dəyişdi','');await save();render();syncNow()}
function merge(sv){const sn=S.sync.snap||{};let conf=0;if(!S.users.length&&sv.cfg)S.cfg=sv.cfg;
 for(const K of KS){const L=new Map((S[K]||[]).map(x=>[x.id,x])),R=new Map((sv[K]||[]).map(x=>[x.id,x])),out=[];
  for(const id of new Set([...L.keys(),...R.keys()])){const l=L.get(id),r=R.get(id),b=sn[id],lj=l&&JSON.stringify(l),rj=r&&JSON.stringify(r);let v;
   if(l&&r)v=(lj===rj||lj===b)?r:(rj===b?l:(conf++,l));
   else if(l)v=(b&&lj===b)?null:l;
   else v=(b&&rj===b)?null:r;
   if(v)out.push(v)}
  S[K]=out}
 S.audit.sort((a,b)=>a.t<b.t?-1:1);if((sv.cfg&&sv.cfg.at||'')>(S.cfg.at||''))S.cfg=sv.cfg;
 if(conf)log('Sinxron konflikt',conf+' qeyd iki cihazda dəyişib: bu cihazın versiyası saxlanıldı')}
async function syncNow(silent){const c=S.sync;if(!c.url||!c.token){if(!silent)alert('Server ünvanı və açar yazılmayıb.');return}
 const base=c.url.replace(/\/+$/,'')+'/api/state',H={Authorization:'Bearer '+c.token,'Content-Type':'application/json'};
 try{setSt('Sinxronlaşır...');
  for(let i=0;i<4;i++){const g=await fetch(base,{headers:H});if(g.status===401)throw new Error('açar yanlışdır');if(!g.ok)throw new Error('server '+g.status);const j=await g.json();
   if(j.data)merge(j.data);
   const p=await fetch(base,{method:'PUT',headers:H,body:JSON.stringify({ver:j.ver,data:strip()})});
   if(p.status===409)continue;if(!p.ok)throw new Error('server '+p.status);
   const r=await p.json();c.ver=r.ver;c.snap=snapOf();c.last=bk();await save();setSt('Uğurlu · '+c.last);render();return}
  throw new Error('konflikt təkrarlandı, bir az sonra yenidən yoxlayın')
 }catch(e){setSt('Xəta: '+(e.message||'şəbəkə')+(navigator.onLine?'':' (offline: dəyişikliklər yerli saxlanılır)'));await save();if(!silent)alert(S.sync.status)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
addEventListener('online',()=>{me&&render();queueSync()});addEventListener('offline',()=>me&&render());
init();
</script></body></html>
